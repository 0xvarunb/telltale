[project]
name = "telltale"
version = "0.1.0"
description = "Briefs ship's officers from published accident reports, every sentence cited."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Varun Bhambri" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "fonttools>=4.68.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "rapidocr-onnxruntime>=1.4.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
telltale = "telltale.cli:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.uv]
# This laptop is an Intel Mac; newer onnxruntime (via fastembed) ships no
# x86_64 macOS wheel, so make uv pick versions that install here.
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
